[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agents"
version = "0.1.0"
description = "Synthetic ground-truth markets and evaluators for LLM factor discovery"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "pyyaml", "pydantic>=2"]

[tool.setuptools.packages.find]
include = ["synthmarket*", "synth_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
