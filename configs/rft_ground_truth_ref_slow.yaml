# QuantEvolver RFT config using the ground-truth evaluator on the ref_slow reference world.
# Shaping (relative reward, diversity/family/novelty/residual archives) is off; GroundTruthReward bypasses it anyway.
rft:
  backend: pure_verl
  mode: seeded_ocd
  reward_kind: cross_sectional_rankic
  bar_minutes: 5
  horizon_bars: 6
  data_dir: runs/worlds/ref_slow/train/data

  reward_impl: ground_truth
  reward_evaluator: "synth_eval.evaluator:build_evaluator"
  reward_kwargs:
    train_dir: runs/worlds/ref_slow/train
    gold_dirs:
      - runs/worlds/ref_slow/gold/seed_1000
      - runs/worlds/ref_slow/gold/seed_1001
      - runs/worlds/ref_slow/gold/seed_1002
      - runs/worlds/ref_slow/gold/seed_1003
    bar_minutes: 5
    horizon_bars: 6
    warmup_days: 1.0

  experiment_name: gt_ref_slow
  project_name: quant_evolver
  output_dir: runs/generated_factors
  run_root: runs/rft
  task_bank_path: runs/task_bank_ref.yaml

  model_path: path/to/base-model
  n_gpus: 1
  total_epochs: 1
  train_batch_size: 4
  rollout_n: 4
  val_n: 1
  save_freq: -1
  test_freq: -1
  max_prompt_length: 3000
  max_response_length: 256
  max_model_len: 4096
  train_prompt_rows: 16
  val_prompt_rows: 4

  relative_reward: false
  diversity_reward: false
  residual_response_reward: false
  xsec_behavior_diversity: false
